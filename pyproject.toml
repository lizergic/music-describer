[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "music-describer"
version = "0.1.0"
description = "Analyze music and generate natural-language descriptions of style and composition"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "librosa>=0.10.0",
    "numpy>=1.23.0",
    "soundfile>=0.12.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40.0"]
openai = ["openai>=1.0.0"]
all = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
music-describer = "music_describer.cli:main"
