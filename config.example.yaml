llm:
  # Provider: claude, openai, or ollama
  provider: claude

  # Model name (provider-specific). Leave blank for provider default.
  # model: claude-sonnet-4-6

  # Environment variable name holding the API key.
  # Defaults: ANTHROPIC_API_KEY (claude), OPENAI_API_KEY (openai)
  # api_key_env: ANTHROPIC_API_KEY

  # Ollama only: base URL for the Ollama server
  # base_url: http://localhost:11434
